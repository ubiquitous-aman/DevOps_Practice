<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form id="registrationForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number">

            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter you mail ID">

            <label for="branch">Branch:</label>
            <input type="text" id="branch" name="branch" placeholder="Enter your branch">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters">

            <div id="error-message"></div>
            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
